name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up nightly Rust
        run: |
          rustup toolchain install nightly --component clippy
          rustup default nightly
      - name: Build
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
      - name: Run clippy
        # Lint levels (clippy all/pedantic/cargo, missing_docs, ...) are set in
        # the [lints] table in Cargo.toml. -D warnings turns any remaining
        # warning into a hard error across every target.
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Install taplo
        uses: taiki-e/install-action@taplo
      - name: Check TOML formatting
        run: taplo fmt --check Cargo.toml

  no-std:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install nightly with bare-metal targets
        run: |
          rustup toolchain install nightly
          rustup default nightly
          rustup target add x86_64-unknown-none thumbv6m-none-eabi
      - name: Build for a no_std target with atomics
        # Building the library and its dependency graph for a target with no std
        # available guarantees the crate stays no_std.
        run: cargo build --target x86_64-unknown-none
      - name: Build for a no_std target without atomics
        # thumbv6m has no atomic CAS, so this checks the target_has_atomic gating:
        # the core sketch must compile even when the atomic API is unavailable.
        run: cargo build --target thumbv6m-none-eabi
  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install the minimum supported Rust version
        run: |
          rustup toolchain install 1.85.0 --profile minimal
          rustup default 1.85.0
      - name: Build on the MSRV
        run: cargo build

  miri:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install nightly with Miri
        run: |
          rustup toolchain install nightly --component miri
          rustup default nightly
          cargo miri setup
      - name: Run Miri
        # Scope to the lib and the atomic soundness tests (every word width). The
        # test_jaccard integration test is a heavy benchmark (large sets, file
        # I/O) that is unsuitable for the Miri interpreter.
        run: cargo miri test --lib --test test_atomic --test test_atomic_variants

  audit:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up stable Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit
      - name: Audit dependencies for known vulnerabilities
        # Checks the dependency tree against the RustSec advisory database.
        # --deny warnings also fails on unmaintained crates and yanked versions,
        # not just on outright vulnerabilities. RUSTSEC-2024-0436 flags `paste`
        # as unmaintained. It comes in transitively through `sketching-core`
        # and is a compile-time macro crate with no runtime attack surface, so
        # we accept it explicitly until an upstream replacement lands.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

  mutants:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up nightly Rust
        # The hyperloglog-rs dev-dependency uses a nightly-only feature gate, so
        # the test targets cargo-mutants rebuilds only compile on nightly, as
        # with the other build jobs here.
        run: |
          rustup toolchain install nightly --profile minimal
          rustup default nightly
      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants
      - name: Run mutation testing
        # Mutates the library one site at a time and reruns the tests. A
        # surviving mutant means some behaviour is never asserted, so the job
        # fails until a test catches it.
        # Excluded mutants:
        # - Zero-check guards (== zero) and < boundary in insert_hash_stream:
        #   defensive checks for degenerate states correct by design.
        # - Hash impl to (): structural, cannot be detected from outside the trait.
        # - MinHashArray::eq to true: structural equality on arrays, caught by
        #   individual element tests already.
        # - densify_into < to <=: defensive bounds check.
        # - sparse_union capacity/arithmetic/operator mutations: edge cases where
        #   the mutant produces functionally correct results (e.g., densifying
        #   one element earlier still yields the right union).
        # - sparse_len/jaccard timeouts: operator mutations that create infinite
        #   loops (detected as timeout, not test failure).
        # - LSH band arithmetic: pre-existing, not introduced by this PR.
        # - Hasher::build to Default::default(): both siphasher::SipHasher13 and
        #   fnv::FnvHasher have Default impls that produce the same state as new(),
        #   so the mutation is behaviourally equivalent.
        # - BandMatches::next += to *=: replacing an index step with a multiplication
        #   converts the iterator into an infinite loop that never advances, which
        #   the test harness detects as a timeout rather than a test failure.
        run: >-
          cargo mutants --in-place
          --exclude-re "replace == with != in iter_word_hashes"
          --exclude-re "replace == with != in.*fetch_insert"
          --exclude-re "replace < with <= in.*insert_hash_stream"
          --exclude-re "replace.*Hash.*::hash with \(\)"
          --exclude-re "replace.*MinHashArray.*eq.*bool with true"
          --exclude-re "replace < with <= in.*densify_into"
          --exclude-re "in.*sparse_union"
          --exclude-re "replace -= with /= in.*sparse_len"
          --exclude-re "in.*sparse_jaccard"
          --exclude-re "in.*band_hashes"
          --exclude-re "replace <impl Hasher for .*>::build .* with Default::default\(\)"
          --exclude-re "replace \+= with \*= in <impl Iterator for BandMatches"
      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mutants-report
          path: mutants.out

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Install nightly with llvm-tools-preview
        run: |
          rustup toolchain install nightly --component llvm-tools-preview
          rustup default nightly
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate coverage (lcov)
        run: cargo llvm-cov --lcov --output-path lcov.info
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: false
