[package]
name = "minhash-rs"
version = "0.6.0"
edition = "2021"
rust-version = "1.85"
authors = ["Luca Cappelletti <cappelletti.luca94@gmail.com>"]
description = "A Rust implementation of MinHash trying to be parsimonious with memory."
homepage = "https://github.com/LucaCappelletti94/minhash-rs"
repository = "https://github.com/LucaCappelletti94/minhash-rs"
readme = "README.md"
license = "MIT"
keywords = [
  "minhash",
  "probabilistic",
  "algorithm",
  "cardinality",
  "estimation",
]
categories = ["no-std", "algorithms", "science"]
# Keep the published package lean: the figures, benchmark datasets, diagrams and
# CI config are only useful in the repository, not to downstream consumers.
exclude = [
  "figures/",
  "tests/*.csv.gz",
  "tests/partial/",
  "minhash_diagram.jpg",
  "minhash_diagram.drawio",
  ".github/",
]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
# Justified, crate-wide exceptions to the pedantic group:
# The docs repeatedly mention type names (MinHash, HyperLogLog, SipHasher13) in
# prose where backticking every occurrence would hurt readability.
doc_markdown = "allow"
# Narrowing u64 hashes into a narrower word is the entire point of Primitive.
cast_possible_truncation = "allow"
# Converting integer counters into f64 for the Jaccard ratio is intentional.
cast_precision_loss = "allow"
# The atomic view in `as_atomic` is an audited &mut [Word] -> &[Atomic] reinterpret.
transmute_ptr_to_ptr = "allow"

[features]
default = ["alloc"]
# Enables allocator-backed types: `LshIndex` (banded LSH over `MinHasher`),
# `QueryState`, and any future surface that needs `Vec`. The core sketch
# operations (`insert`, `may_contain`, `estimate_jaccard_index`,
# `band_hashes`) do NOT require this feature.
alloc = []
# Enables parallel bulk build for `LshIndex`. Pulls in `rayon`. Implies
# `alloc` because the index itself already needs it.
rayon = ["dep:rayon", "alloc"]
# Enables save and mmap load for `LshIndex`, `MinHash`, `SparseHashes`,
# and `SparseValues`. Pulls in `epserde` with its mmap backend. Implies
# `alloc`.
epserde = ["dep:epserde", "alloc"]


[dependencies]
siphasher = { version = "1.0", default-features = false }
fnv = { version = "1.0.3", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-big-array = "0.5"
sketching-core = "0.1"
dsi-bitstream = { version = "0.9", default-features = false }
rayon = { version = "1.10", optional = true }
epserde = { version = "0.12", optional = true, default-features = false, features = ["derive", "mmap", "std"] }

[dev-dependencies]
criterion = "0.8"
serde_json = "1.0"
rayon = "1.5"
hyperloglog-rs = "0.1"
indicatif = { version = "0.18", features = ["rayon"] }
proptest = "1"

# Criterion benchmark harness
[[bench]]
name = "bench_insert"
harness = false
# Optimize tests so the data-structure heavy tests run quickly, while keeping
# overflow checks and debug assertions on to catch bugs.
[profile.test]
overflow-checks = true
debug = false
debug-assertions = true
opt-level = 3
